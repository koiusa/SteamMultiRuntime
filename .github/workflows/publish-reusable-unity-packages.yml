name: Publish reusable Unity packages to npm

on:
  workflow_call:
    inputs:
      publish:
        description: Publish packages after validating their npm tarballs
        required: true
        type: boolean
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Validate package manifests and tarballs
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            Assets/SteamMultiRuntime/Runtime/Packages/com.koiusa.input.core
            Assets/SteamMultiRuntime/Runtime/Packages/com.koiusa.application
            Assets/SteamMultiRuntime/Runtime/Packages/com.koiusa.ui.core
            Assets/SteamMultiRuntime/Runtime/Packages/com.koiusa.keyconfig
          )

          for package_dir in "${packages[@]}"; do
            npm pkg get name version --prefix "$package_dir"
            npm pack "$package_dir" --dry-run
          done

      - name: Publish unpublished versions
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            Assets/SteamMultiRuntime/Runtime/Packages/com.koiusa.input.core
            Assets/SteamMultiRuntime/Runtime/Packages/com.koiusa.application
            Assets/SteamMultiRuntime/Runtime/Packages/com.koiusa.ui.core
            Assets/SteamMultiRuntime/Runtime/Packages/com.koiusa.keyconfig
          )

          for package_dir in "${packages[@]}"; do
            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}: already published"
              continue
            fi

            npm publish "$package_dir" --access public
          done
