name: Create UPM Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get version from package.json
        id: package_version
        run: |
          echo "PACKAGE_VERSION=$(jq -r .version Assets/SteamMultiRuntime/package.json)" >> $GITHUB_ENV

      - name: Create and Push Git Tag (if not exists)
        run: |
          if git ls-remote --tags origin | grep "refs/tags/v${PACKAGE_VERSION}$"; then
            echo "Tag v${PACKAGE_VERSION} already exists. Skipping tag creation."
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag v${PACKAGE_VERSION}
            git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} v${PACKAGE_VERSION}
          fi
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

      - name: Prepare UPM package
        run: |
          mkdir -p upm
          cp -r Assets/SteamMultiRuntime/* upm/

      - name: Zip UPM package
        run: |
          cd upm
          zip -r ../SteamMultiRuntime-upm.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: v${{ env.PACKAGE_VERSION }}
          files: SteamMultiRuntime-upm.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public
        working-directory: Assets/SteamMultiRuntime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
