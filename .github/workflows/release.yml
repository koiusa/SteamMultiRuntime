name: Create UPM Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reusable packages and create the SteamMultiRuntime release
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  validate-root-package:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="Assets/SteamMultiRuntime"
          package_name="$(node -p "require('./${package_dir}/package.json').name")"
          package_version="$(node -p "require('./${package_dir}/package.json').version")"
          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Validate UPM npm tarball
        run: npm pack --dry-run
        working-directory: Assets/SteamMultiRuntime

  reusable-packages:
    needs: validate-root-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate and publish reusable packages
        uses: ./.github/actions/publish-reusable-packages
        with:
          publish: ${{ github.event_name == 'push' || inputs.publish }}

  release:
    if: github.event_name == 'push' || inputs.publish
    needs:
      - validate-root-package
      - reusable-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Verify OIDC availability
        shell: bash
        run: test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"

      - name: Check published npm version
        id: npm
        shell: bash
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE_NAME: ${{ needs.validate-root-package.outputs.name }}
          PACKAGE_VERSION: ${{ needs.validate-root-package.outputs.version }}

      - name: Check GitHub release
        id: github_release
        shell: bash
        run: |
          if gh release view "v${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.validate-root-package.outputs.version }}

      - name: Prepare UPM archive
        if: steps.github_release.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upm
          package_dir="Assets/SteamMultiRuntime"
          package_files=(
            CHANGELOG.md
            CHANGELOG.md.meta
            Documentation~
            Editor
            Editor.meta
            Runtime
            Runtime.meta
            Samples
            Samples.meta
            Tests
            Tests.meta
            package.json
            package.json.meta
          )
          for package_file in "${package_files[@]}"; do
            cp -r "${package_dir}/${package_file}" upm/
          done
          cd upm
          zip -r ../SteamMultiRuntime-upm.zip .

      - name: Import GPG key
        if: steps.github_release.outputs.exists == 'false'
        shell: bash
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign UPM archive
        if: steps.github_release.outputs.exists == 'false'
        shell: bash
        run: printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --detach-sign --output SteamMultiRuntime-upm.zip.sig SteamMultiRuntime-upm.zip
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish SteamMultiRuntime to npm
        if: steps.npm.outputs.published == 'false'
        run: npm publish --access public
        working-directory: Assets/SteamMultiRuntime

      - name: Create GitHub release and tag
        if: steps.github_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-root-package.outputs.version }}
          name: v${{ needs.validate-root-package.outputs.version }}
          generate_release_notes: true
          files: |
            SteamMultiRuntime-upm.zip
            SteamMultiRuntime-upm.zip.sig
