name: Create UPM Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: package_version
        run: |
          echo "PACKAGE_VERSION=$(jq -r .version Assets/SteamMultiRuntime/package.json)" >> $GITHUB_ENV

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep "refs/tags/v${PACKAGE_VERSION}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

      - name: Create and Push Git Tag (if not exists)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag v${PACKAGE_VERSION}
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} v${PACKAGE_VERSION}
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

      - name: Prepare UPM package
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p upm
          cp -r Assets/SteamMultiRuntime/* upm/

      - name: Zip UPM package
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cd upm
          zip -r ../SteamMultiRuntime-upm.zip .

      - name: Import GPG key
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign UPM package
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --detach-sign -o SteamMultiRuntime-upm.zip.sig SteamMultiRuntime-upm.zip
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: v${{ env.PACKAGE_VERSION }}
          files: |
            SteamMultiRuntime-upm.zip
            SteamMultiRuntime-upm.zip.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        if: steps.check_tag.outputs.exists == 'false'
        run: npm publish --access public
        working-directory: Assets/SteamMultiRuntime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
